<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huawei Servisleri - Servis Rehberi</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    color: #1f2937;
}

header {
    background: #111827;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 25px 15px;
}

.back {
    display: inline-block;
    margin-bottom: 20px;
    text-decoration: none;
    color: #2563eb;
    font-weight: bold;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 15px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.card h2 {
    margin-top: 0;
}

.card p {
    color: #6b7280;
}

select {
    width: 100%;
    padding: 14px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
    background: white;
}
</style>
</head>

<body>

<header>
    <h1>Huawei Servisleri</h1>
</header>

<div class="container">

<a class="back" href="index.html">← Ana Sayfaya Dön</a>

<div class="card">
    <h2>Şehir Seçiniz</h2>

    <select id="citySelect" onchange="showCity()">
        <option value="">Şehir seçiniz</option>
        <option value="ankara">Ankara</option>
        <option value="istanbul">İstanbul</option>
        <option value="izmir">İzmir</option>
        <option value="bursa">Bursa</option>
        <option value="antalya">Antalya</option>
    </select>
</div>

<div id="cityResult"></div>

</div>

<script>
function showCity() {

    const city = document.getElementById("citySelect").value;
    const result = document.getElementById("cityResult");

    if (city === "") {
        result.innerHTML = "";
        return;
    }

    if (city === "ankara") {

        result.innerHTML = `

        <div class="card">
            <h2>Ankara Huawei Servisleri</h2>
            <p>Huawei cihazları için servis noktaları.</p>
        </div>

        <div class="card">
            <h2>Huawei Yetkili Servis - Ankara</h2>
            <p><strong>Şehir:</strong> Ankara</p>
            <p><strong>Tür:</strong> Huawei Yetkili Servis</p>
            <p>Adres ve telefon bilgileri doğrulandıktan sonra eklenecek.</p>
        </div>

        `;

    } else {

        const names = {
            istanbul: "İstanbul",
            izmir: "İzmir",
            bursa: "Bursa",
            antalya: "Antalya"
        };

        result.innerHTML = `
        <div class="card">
            <h2>${names[city]} Huawei Servisleri</h2>
            <p>Bu şehirdeki yetkili servis bilgileri hazırlanıyor.</p>
        </div>
        `;
    }
}
</script>

</body>
</html>
