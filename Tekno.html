<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TECNO Yetkili Servisleri - Servis Rehberi</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    color: #1f2937;
}

header {
    background: #111827;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 8px 0 0;
    opacity: 0.85;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 25px 15px;
}

.back {
    display: inline-block;
    margin-bottom: 20px;
    text-decoration: none;
    color: #2563eb;
    font-weight: bold;
}

.search-box {
    background: white;
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 25px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.search-box h2 {
    margin-top: 0;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 15px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.card h3 {
    margin-top: 0;
    font-size: 19px;
}

.card p {
    margin: 8px 0;
    color: #6b7280;
}

.type {
    color: #111827 !important;
    font-weight: bold;
}

.no-result {
    display: none;
    text-align: center;
    padding: 20px;
    color: #6b7280;
}
</style>
</head>

<body>

<header>
    <h1>TECNO Yetkili Servisleri</h1>
    <p>Türkiye Geneli</p>
</header>

<div class="container">

<a class="back" href="index.html">← Ana Sayfaya Dön</a>

<div class="search-box">
    <h2>TECNO Servisi Ara</h2>

    <input
        type="text"
        id="searchBox"
        placeholder="Şehir veya servis adı yazın..."
        onkeyup="searchServices()"
    >
</div>

<div id="services">

<div class="card service">
    <h3>TECNO Yetkili Servisleri</h3>
    <p>Türkiye genelindeki TECNO yetkili servis noktaları burada listelenecek.</p>
    <p class="type">TECNO Yetkili Servis</p>
</div>

</div>

<div id="noResult" class="no-result">
    Aradığınız servis bulunamadı.
</div>

</div>

<script>

function searchServices() {

    const search =
        document.getElementById("searchBox")
        .value
        .toLowerCase()
        .trim();

    const services =
        document.querySelectorAll(".service");

    let found = 0;

    services.forEach(function(service) {

        const text =
            service.innerText.toLowerCase();

        if (text.includes(search)) {
            service.style.display = "block";
            found++;
        } else {
            service.style.display = "none";
        }
    });

    document.getElementById("noResult").style.display =
        found === 0 ? "block" : "none";
}

</script>

</body>
</html>
