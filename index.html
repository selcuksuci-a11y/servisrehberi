<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teknik Servis Rehberi</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    color: #1f2937;
}

header {
    background: #111827;
    color: white;
    text-align: center;
    padding: 22px 15px 28px;
}

/* BRİKO LOGOSU */
.logo {
    width: 110px;
    height: 110px;
    object-fit: contain;
    display: block;
    margin: 0 auto 10px;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin: 8px 0 0;
    font-size: 15px;
    opacity: 0.85;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 25px 15px;
}

.search-box {
    background: white;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.search-box h2 {
    margin-top: 0;
    font-size: 20px;
}

select {
    width: 100%;
    padding: 14px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
    background: white;
}

.section-title {
    margin-top: 30px;
    margin-bottom: 15px;
    font-size: 23px;
}

.brands {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.brand {
    background: white;
    padding: 18px 10px;
    border-radius: 12px;
    text-align: center;
    font-weight: bold;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    cursor: pointer;
    transition: 0.2s;
}

.brand:hover {
    transform: translateY(-2px);
}

footer {
    text-align: center;
    padding: 30px 15px;
    color: #6b7280;
    font-size: 14px;
}

@media (min-width: 600px) {
    .brands {
        grid-template-columns: repeat(4, 1fr);
    }
}
</style>
</head>

<body>

<header>

    <img src="briko.png" alt="Briko" class="logo">

    <h1>Teknik Servis Rehberi</h1>

    <p>Türkiye'nin teknik servis rehberi</p>

</header>

<div class="container">

    <div class="search-box">

        <h2>Marka Seçiniz</h2>

        <select onchange="goToBrand(this.value)">

            <option value="">Marka seçiniz</option>

            <option value="Apple.html">Apple</option>

            <option value="Samsung.html">Samsung</option>

            <option value="Xiaomi.html">Xiaomi</option>

            <option value="Huawei.html">Huawei</option>

            <option value="Oppo.html">Oppo</option>

            <option value="Vivo.html">Vivo</option>

            <option value="tecno.html">TECNO</option>

            <option value="reeder.html">REEDER</option>

        </select>

    </div>


    <h2 class="section-title">Popüler Markalar</h2>


    <div class="brands">

        <div class="brand" onclick="goToBrand('Apple.html')">
            Apple
        </div>

        <div class="brand" onclick="goToBrand('Samsung.html')">
            Samsung
        </div>

        <div class="brand" onclick="goToBrand('Xiaomi.html')">
            Xiaomi
        </div>

        <div class="brand" onclick="goToBrand('Huawei.html')">
            Huawei
        </div>

        <div class="brand" onclick="goToBrand('Oppo.html')">
            Oppo
        </div>

        <div class="brand" onclick="goToBrand('Vivo.html')">
            Vivo
        </div>

        <div class="brand" onclick="goToBrand('tecno.html')">
            TECNO
        </div>

        <div class="brand" onclick="goToBrand('reeder.html')">
            REEDER
        </div>

    </div>

</div>


<footer>
    © 2026 Teknik Servis Rehberi
</footer>


<script>

function goToBrand(page) {

    if (page !== "") {

        window.location.href = page;

    }

}

</script>

</body>
</html>
