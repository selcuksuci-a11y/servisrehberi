<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Servis Rehberi</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    color: #1f2937;
}

header {
    background: #111827;
    color: white;
    text-align: center;
    padding: 28px 15px;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    margin: 8px 0 0;
    font-size: 15px;
    opacity: 0.85;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 25px 15px;
}

.search-box {
    background: white;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.search-box h2 {
    margin-top: 0;
    font-size: 20px;
}

select {
    width: 100%;
    padding: 14px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
    background: white;
}

.section-title {
    margin-top: 30px;
    margin-bottom: 15px;
    font-size: 23px;
}

.brands {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.brand {
    background: white;
    padding: 18px 10px;
    border-radius: 12px;
    text-align: center;
    font-weight: bold;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
}

.brand:hover {
    transform: translateY(-2px);
}

footer {
    text-align: center;
    padding: 30px 15px;
    color: #6b7280;
    font-size: 14px;
}

@media (min-width: 600px) {
    .brands {
        grid-template-columns: repeat(4, 1fr);
    }
}
</style>
</head>

<body>

<header>
    <h1>Servis Rehberi</h1>
    <p>Türkiye'nin teknik servis rehberi</p>
</header>

<div class="container">

    <div class="search-box">
        <h2>Marka seçiniz</h2>

        <select>
            <option value="">Marka seçiniz</option>
            <option>Apple</option>
            <option>Samsung</option>
            <option>Xiaomi</option>
            <option>Huawei</option>
            <option>Oppo</option>
            <option>Vivo</option>
            <option>Sony</option>
            <option>Nokia</option>
        </select>
    </div>

    <h2 class="section-title">Popüler Markalar</h2>

 <div class="brand" onclick="window.location.href='Apple.html'">Apple</div>
    <div class="brand" onclick="window.location.href='Samsung.html'">Samsung</div>
        <div class="brand">Xiaomi</div>
        <div class="brand">Huawei</div>
        <div class="brand">Oppo</div>
        <div class="brand">Vivo</div>
        <div class="brand">Sony</div>
        <div class="brand">Nokia</div>
    </div>

</div>

<footer>
    © 2026 Servis Rehberi
</footer>

</body>
</html>
